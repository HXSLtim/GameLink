# GameLink Staging 环境部署配置
# 用于测试和预生产环境

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: gamelink-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gamelink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gamelink_staging}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
    networks:
      - gamelink-staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamelink} -d ${POSTGRES_DB:-gamelink_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: gamelink-redis-staging
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_staging_data:/data
    networks:
      - gamelink-staging-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # 后端服务
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        GOPROXY: https://goproxy.cn,direct
    image: gamelink-backend:staging
    container_name: gamelink-backend-staging
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    environment:
      # 应用配置
      - APP_ENV=staging
      - SERVICE_PORT=8081
      - GIN_MODE=release
      - GOMAXPROCS=${GOMAXPROCS:-2}
      # 数据库配置
      - DB_DSN=host=postgres port=5432 user=${POSTGRES_USER:-gamelink} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-gamelink_staging} sslmode=disable
      - DB_MAX_CONNS=${DB_MAX_CONNS:-25}
      - DB_MAX_IDLE=${DB_MAX_IDLE:-10}
      # Redis配置
      - CACHE_TYPE=redis
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-1}
      # JWT配置
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_TOKEN_TTL_HOURS=${JWT_TOKEN_TTL_HOURS:-24}
      # 加密配置（Staging 环境启用，测试生产配置）
      - CRYPTO_ENABLED=${CRYPTO_ENABLED:-true}
      - CRYPTO_SECRET_KEY=${CRYPTO_SECRET_KEY}
      - CRYPTO_IV=${CRYPTO_IV}
      - CRYPTO_USE_SIGNATURE=${CRYPTO_USE_SIGNATURE:-true}
      # 超级管理员配置
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
      - SUPER_ADMIN_NAME=${SUPER_ADMIN_NAME:-Staging Admin}
      # 种子数据（Staging 环境启用）
      - SEED_ENABLED=${SEED_ENABLED:-true}
      # 支付配置 (Staging 环境默认关闭，测试时启用)
      - WECHAT_PAY_ENABLED=${WECHAT_PAY_ENABLED:-false}
      - WECHAT_PAY_APP_ID=${WECHAT_PAY_APP_ID}
      - WECHAT_PAY_MCH_ID=${WECHAT_PAY_MCH_ID}
      - WECHAT_PAY_API_KEY=${WECHAT_PAY_API_KEY}
      - WECHAT_PAY_CERT_PATH=/app/certs/wechat/apiclient_cert.p12
      - WECHAT_PAY_KEY_PATH=/app/certs/wechat/apiclient_key.pem
      - WECHAT_PAY_CERT_SERIAL_NO=${WECHAT_PAY_CERT_SERIAL_NO}
      - WECHAT_PAY_NOTIFY_URL=${WECHAT_PAY_NOTIFY_URL:-https://staging.gamelink.com/api/v1/payments/wechat/notify}
      - ALIPAY_ENABLED=${ALIPAY_ENABLED:-false}
      - ALIPAY_APP_ID=${ALIPAY_APP_ID}
      - ALIPAY_GATEWAY=${ALIPAY_GATEWAY:-https://openapi.alipay.com/gateway.do}
      - ALIPAY_PRIVATE_KEY_PATH=/app/certs/alipay/app_private_key.pem
      - ALIPAY_PUBLIC_KEY_PATH=/app/certs/alipay/alipay_public_key.pem
      - ALIPAY_NOTIFY_URL=${ALIPAY_NOTIFY_URL:-https://staging.gamelink.com/api/v1/payments/alipay/notify}
    volumes:
      # 配置文件
      - ./api/configs:/app/configs:ro
      # 支付证书文件 (只读挂载)
      - ./certs/wechat:/app/certs/wechat:ro
      - ./certs/alipay:/app/certs/alipay:ro
      # 数据目录
      - backend_staging_data:/app/var
      - backend_staging_logs:/app/logs
    networks:
      - gamelink-staging-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/v1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # 管理后台前端
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
    image: gamelink-admin:staging
    container_name: gamelink-admin-staging
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gamelink-staging-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  gamelink-staging-network:
    driver: bridge
    name: gamelink-staging-network

volumes:
  postgres_staging_data:
    name: gamelink-postgres-staging-data
  redis_staging_data:
    name: gamelink-redis-staging-data
  backend_staging_data:
    name: gamelink-backend-staging-data
  backend_staging_logs:
    name: gamelink-backend-staging-logs
