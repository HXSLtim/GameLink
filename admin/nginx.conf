server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker内部DNS解析器
    resolver 127.0.0.11 valid=30s;

    # 启用gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/javascript application/json
               application/xml application/atom+xml
               image/svg+xml;

    # 启用预压缩文件支持（.gz 和 .br）
    gzip_static on;
    # brotli_static on;  # 需要 ngx_brotli 模块

    # 连接优化
    keepalive_timeout 65;
    keepalive_requests 1000;

    # 缓冲区优化
    client_body_buffer_size 16k;
    client_max_body_size 10m;
    proxy_buffer_size 4k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 24k;

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API代理到后端
    location /api/ {
        # 使用变量延迟DNS解析，避免nginx启动时backend服务未就绪
        # 后端运行在宿主机开发服务器
        set $backend_upstream http://host.docker.internal:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 超时优化
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Swagger文档代理
    location /swagger/ {
        # 使用变量延迟DNS解析
        # 后端运行在宿主机开发服务器
        set $backend_upstream http://host.docker.internal:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router支持 - 所有路由返回index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 避免 PWA/浏览器缓存旧的入口文件，导致资源 404
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    location = /manifest.webmanifest.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
