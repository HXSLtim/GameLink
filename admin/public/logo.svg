<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6A7BFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D2FF;stop-opacity:1" />
    </linearGradient>
    <mask id="cutout">
      <rect x="0" y="0" width="200" height="200" fill="white" />
      
      <!-- D-Pad (Left) - Centered at (50, 100), Size 28x28 -->
      <path d="M 46 86 h 8 v 10 h 10 v 8 h -10 v 10 h -8 v -10 h -10 v -8 h 10 z" fill="black" />
      
      <!-- Buttons (Right) - Centered at (150, 100), Size 28x28 -->
      <g transform="translate(150, 100)">
        <circle cx="0" cy="-10" r="4" fill="black" />
        <circle cx="10" cy="0" r="4" fill="black" />
        <circle cx="0" cy="10" r="4" fill="black" />
        <circle cx="-10" cy="0" r="4" fill="black" />
      </g>
      
      <!-- Checkmark (Center) - Cutout directly from body -->
      <path d="M 88 100 L 98 110 L 112 90" fill="none" stroke="black" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </mask>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" rx="40" ry="40" fill="url(#grad)" />
  
  <!-- Main Icon Shape -->
  <g mask="url(#cutout)">
    <!-- Controller Body -->
    <rect x="30" y="60" width="140" height="80" rx="20" fill="white" />
    <!-- Chat Bubble Tail -->
    <path d="M 110 140 L 110 155 L 90 140 Z" fill="white" />
  </g>
</svg>
