# GameLink 仅后端服务 Docker Compose 配置
# 用于快速测试后端服务
# 使用方式: docker-compose -f docker-compose.backend-only.yml up -d

services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GOPROXY: https://goproxy.cn,direct
    container_name: gamelink-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - APP_ENV=development
      - SERVICE_PORT=8080
    volumes:
      # 挂载配置文件
      - ./backend/configs:/app/configs:ro
      # 挂载数据目录（SQLite数据库）
      - backend-data:/app/var
    networks:
      - gamelink-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  gamelink-network:
    driver: bridge
    name: gamelink-network

volumes:
  backend-data:
    name: gamelink-backend-data
