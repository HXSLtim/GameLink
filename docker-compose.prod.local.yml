# GameLink 本地生产环境测试配置
# 使用方式: docker-compose --env-file .env.production.local -f docker-compose.prod.local.yml up -d

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: gamelink-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-gamelink}
      - POSTGRES_USER=${POSTGRES_USER:-gamelink}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-gamelink123}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/scripts/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"  # 避免与本地PostgreSQL冲突
    networks:
      - gamelink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamelink}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: gamelink-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6380:6379"  # 避免与本地Redis冲突
    networks:
      - gamelink-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        GOPROXY: https://goproxy.cn,direct
    container_name: gamelink-backend
    restart: unless-stopped
    ports:
      - "8081:8080"  # 使用8081避免冲突
    environment:
      - APP_ENV=${APP_ENV:-staging}
      - SERVICE_PORT=8080
      # 数据库配置
      - DB_DSN=postgresql://${POSTGRES_USER:-gamelink}:${POSTGRES_PASSWORD:-gamelink123}@postgres:5432/${POSTGRES_DB:-gamelink}?sslmode=disable
      # Redis配置
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - REDIS_DB=0
      # JWT密钥
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # 加密配置
      - CRYPTO_SECRET_KEY=${CRYPTO_SECRET_KEY}
      - CRYPTO_IV=${CRYPTO_IV}
      # 管理员配置
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-admin@gamelink.com}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
      # 加密配置（本地生产环境不加密）
      - CRYPTO_ENABLED=${CRYPTO_ENABLED:-false}
    volumes:
      - ./api/configs:/app/configs:ro
      - backend-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gamelink-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  gamelink-network:
    name: gamelink-network
    driver: bridge

volumes:
  postgres-data:
    name: gamelink-postgres-data
  redis-data:
    name: gamelink-redis-data
  backend-logs:
    name: gamelink-backend-logs
