name: Test and Coverage

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test.yml'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gamelink_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true

    - name: Install dependencies
      run: |
        go mod download
        go mod tidy

    - name: Install test tools
      run: |
        go install github.com/vektra/mockery/v2@latest
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

    - name: Generate mocks
      run: |
        cd internal/repository
        mockery --all --output=mocks --outpkg=mocks --with-expecter
        cd ../service
        mockery --all --output=mocks --outpkg=mocks --with-expecter

    - name: Run tests
      run: |
        go test ./... -v -coverprofile=coverage.out -covermode=atomic

    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Total coverage: $COVERAGE%"
        
        # Set threshold based on current phase
        if (( $(echo "$COVERAGE < 5" | bc -l) )); then
          echo "❌ Coverage is below 5% (Week 1 target)"
          exit 1
        fi
        
        echo "✅ Coverage check passed"

    - name: Generate coverage report
      run: |
        go tool cover -html=coverage.out -o coverage.html
        go tool cover -func=coverage.out > coverage.txt

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true
        verbose: true

    - name: Run linter
      run: |
        golangci-lint run ./... --timeout=10m

    - name: Check test file naming
      run: |
        # Ensure all test files follow *.test.go naming
        if find . -name "*_test.go" -o -name "xx_xx.test.go" | grep -q .; then
          echo "❌ Found test files with incorrect naming. All test files must be named *.test.go"
          find . -name "*_test.go" -o -name "xx_xx.test.go"
          exit 1
        fi
        echo "✅ All test files follow correct naming convention (*.test.go)"

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: |
          coverage.out
          coverage.html
          coverage.txt
        retention-days: 30

  coverage-report:
    name: Coverage Report
    needs: test
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Download coverage artifacts
      uses: actions/download-artifact@v3
      with:
        name: coverage-report

    - name: Comment PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const coverage = fs.readFileSync('coverage.txt', 'utf8');
          const totalLine = coverage.split('\n').find(line => line.includes('total'));
          const totalCoverage = totalLine ? totalLine.split('\t')[2] : 'N/A';
          
          const comment = `## Coverage Report
          
          Total Coverage: **${totalCoverage}**
          
          <details>
          <summary>Detailed Report</summary>
          
          \`\`\`
          ${coverage}
          \`\`\`
          </details>
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
