# GameLink 开发环境 - 后端 + Admin Docker Compose
# 使用方式: docker-compose -f docker-compose.dev.yml up -d
# 
# 前提: 先运行 docker-compose up -d 启动数据库服务

services:
  # 后端服务
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        GOPROXY: https://goproxy.cn,direct
    container_name: gamelink-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 应用配置
      - APP_ENV=development
      - SERVICE_PORT=8080
      - GIN_MODE=debug
      # 数据库配置 (连接到已运行的 postgres 容器)
      - DB_DSN=host=gamelink-postgres port=5432 user=gamelink password=gamelink123 dbname=gamelink sslmode=disable
      - DB_MAX_CONNS=25
      - DB_MAX_IDLE=5
      # Redis配置 (连接到已运行的 redis 容器)
      - CACHE_TYPE=redis
      - REDIS_ADDR=gamelink-redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      # JWT配置
      - JWT_SECRET_KEY=dev-jwt-secret-key-minimum-32-chars
      - JWT_TOKEN_TTL_HOURS=24
      # 加密配置 (开发环境关闭)
      - CRYPTO_ENABLED=false
      # 超级管理员配置
      - SUPER_ADMIN_EMAIL=admin@gamelink.com
      - SUPER_ADMIN_PASSWORD=Admin123456
      - SUPER_ADMIN_NAME=Super Admin
      # 种子数据
      - SEED_ENABLED=true
    networks:
      - gamelink-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 管理后台前端
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
    container_name: gamelink-admin
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gamelink-network

networks:
  gamelink-network:
    external: true
    name: gamelink-network
