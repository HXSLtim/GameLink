<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="0.4" stop-color="#2d1b69"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow2" cx="950" cy="200" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card-bg" x1="720" y1="60" x2="1120" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="1200" height="450" rx="24" fill="url(#bg2)"/>
  <rect width="1200" height="450" rx="24" fill="url(#glow2)"/>
  <!-- 装饰：星星 -->
  <g fill="#c084fc">
    <circle cx="200" cy="60" r="2" opacity="0.4"/>
    <circle cx="350" cy="40" r="1.5" opacity="0.3"/>
    <circle cx="500" cy="80" r="2" opacity="0.5"/>
    <circle cx="650" cy="30" r="1.5" opacity="0.3"/>
    <circle cx="150" cy="400" r="2" opacity="0.3"/>
    <circle cx="420" cy="420" r="1.5" opacity="0.4"/>
    <circle cx="580" cy="390" r="2" opacity="0.25"/>
  </g>
  <!-- 右侧装饰卡片 -->
  <rect x="720" y="60" width="400" height="330" rx="20" fill="url(#card-bg)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <!-- 卡片内：奖杯图标 -->
  <g transform="translate(870, 130)" opacity="0.25" stroke="#c084fc" stroke-width="3" fill="none">
    <path d="M0,80 L0,20 Q0,0 20,0 L80,0 Q100,0 100,20 L100,80 Q100,120 50,140 Q0,120 0,80Z"/>
    <line x1="50" y1="140" x2="50" y2="170"/>
    <line x1="20" y1="170" x2="80" y2="170"/>
    <path d="M0,30 Q-30,30 -30,60 Q-30,90 0,80"/>
    <path d="M100,30 Q130,30 130,60 Q130,90 100,80"/>
  </g>
  <!-- 卡片内：排名条 -->
  <g transform="translate(760, 280)">
    <rect width="320" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.06"/>
    <rect width="240" height="10" rx="5" fill="#c084fc" fill-opacity="0.3"/>
    <rect y="25" width="320" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.06"/>
    <rect y="25" width="180" height="10" rx="5" fill="#c084fc" fill-opacity="0.2"/>
    <rect y="50" width="320" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.06"/>
    <rect y="50" width="280" height="10" rx="5" fill="#c084fc" fill-opacity="0.15"/>
  </g>
  <!-- 装饰圆环 -->
  <circle cx="1100" cy="80" r="60" stroke="#c084fc" stroke-width="1.5" fill="none" opacity="0.1"/>
  <circle cx="680" cy="400" r="90" stroke="#fff" stroke-width="1" fill="none" opacity="0.04"/>
  <!-- 标签条 -->
  <rect x="80" y="100" width="60" height="6" rx="3" fill="url(#accent2)"/>
  <!-- 主标题 -->
  <text x="80" y="170" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="48" font-weight="800" fill="#FFFFFF" letter-spacing="2">
    新赛季开启
  </text>
  <!-- 副标题 -->
  <text x="80" y="225" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="400" fill="#c4b5fd">
    冲分上王者，认证陪玩全程护航
  </text>
  <!-- CTA 按钮 -->
  <rect x="80" y="270" width="180" height="52" rx="26" fill="url(#accent2)"/>
  <text x="118" y="303" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#1a1a2e">
    查看详情 →
  </text>
  <!-- 底部亮点标签 -->
  <g transform="translate(80, 355)">
    <rect width="120" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.08" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1"/>
    <text x="20" y="24" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#c4b5fd">🏆 限时活动</text>
    <rect x="140" width="140" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.08" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1"/>
    <text x="160" y="24" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#c4b5fd">⭐ 王者认证陪玩</text>
    <rect x="300" width="120" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.08" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1"/>
    <text x="320" y="24" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#c4b5fd">🎮 全段位覆盖</text>
  </g>
</svg>
