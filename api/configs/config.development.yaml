# 开发环境配置文件
# 用于本地开发和测试

server:
  port: "8080"
  enable_swagger: true

database:
  type: "postgres"
  dsn: "host=localhost port=5433 user=gamelink password=gamelink dbname=gamelink_dev sslmode=disable"

cache:
  type: "redis"
  redis:
    addr: "localhost:6380"
    password: ""
    db: 0

crypto:
  enabled: false
  secret_key: "GameLink2025SecretKey!@#"
  iv: "GameLink2025IV!!!"
  methods:
    - POST
    - PUT
    - PATCH
  exclude_paths:
    - "/api/v1/health"
    - "/api/v1/ping"
    - "/api/v1/auth/refresh"
  use_signature: true

auth:
  jwt_secret: "MiBSQJJKEW2euVXKpvxRzjS1C5TCFlXx4RXGUXSdWpJ"
  token_ttl_hours: 24

seed:
  enabled: true

super_admin:
  email: "admin@gameLink.com"
  password: "123456"
  name: "Super Admin"
  phone: ""

admin_auth:
  mode: "jwt"

# 外部API凭证配置（可选）
external_apis:
  # 微信支付配置
  wechat_pay:
    app_id: ""                    # 微信支付应用ID
    mch_id: ""                    # 商户号
    api_key: ""                   # API密钥
    api_cert_path: ""             # API证书路径
    notify_url: ""                # 支付结果通知URL
    enabled: false                # 是否启用微信支付

  # 支付宝配置
  alipay:
    app_id: ""                    # 支付宝应用ID
    private_key_path: ""          # 应用私钥路径
    public_key_path: ""           # 支付宝公钥路径
    notify_url: ""                # 支付结果通知URL
    enabled: false                # 是否启用支付宝

  # 短信服务配置
  sms:
    provider: ""                  # 服务商: aliyun, tencent
    access_key: ""                # AccessKey ID
    secret_key: ""                # AccessKey Secret
    sign_name: ""                 # 短信签名
    enabled: false                # 是否启用短信服务

  # OSS对象存储配置
  oss:
    provider: ""                  # 服务商: aliyun, qcloud, minio
    endpoint: ""                  # 访问域名
    access_key: ""                # AccessKey ID
    secret_key: ""                # AccessKey Secret
    bucket: ""                    # 存储桶名称
    region: ""                    # 区域
    enabled: false                # 是否启用OSS
