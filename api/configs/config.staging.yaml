# Staging环境配置文件（本地生产模拟，不加密）

server:
  port: "8080"
  enable_swagger: false

database:
  type: "postgres"
  # dsn 设置通过环境变量 DB_DSN 提供
  dsn: ""

cache:
  type: "redis"
  redis:
    addr: "redis:6379"
    password: "redis123"
    db: 0

crypto:
  enabled: false  # Staging环境不加密
  secret_key: ""
  iv: ""
  methods:
    - POST
    - PUT
    - PATCH
  exclude_paths:
    - "/api/v1/health"
    - "/api/v1/ping"
    - "/api/v1/auth/refresh"
  use_signature: false

signature:
  enabled: false
  secret_key: ""
  header_name: "X-Signature"
  methods:
    - POST
    - PUT
    - PATCH
    - DELETE
  exclude_paths:
    - "/api/v1/health"
    - "/api/v1/ping"
    - "/api/v1/auth/refresh"

auth:
  jwt_secret: ""  # 通过环境变量 JWT_SECRET_KEY 提供
  token_ttl_hours: 24

seed:
  enabled: true

super_admin:
  email: "admin@gamelink.com"  # 通过环境变量 SUPER_ADMIN_EMAIL 配置
  password: ""  # 通过环境变量 SUPER_ADMIN_PASSWORD 配置
  name: "Super Admin"
  phone: ""

admin_auth:
  mode: "jwt"

# 外部API（全部禁用）
external_apis:
  wechat_pay:
    enabled: false
  alipay:
    enabled: false
  sms:
    enabled: false
  oss:
    enabled: false
