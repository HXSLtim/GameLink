host: localhost:8080
info:
  contact:
    email: support@gamelink.com
    name: GameLink Support
  description: |-
    GameLink 游戏陪玩服务平台 API
    提供用户认证、订单管理、支付结算、陪玩师管理等功能
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://gamelink.com/terms/
  title: GameLink API
  version: 0.3.0
paths:
  /admin/analytics/active-users:
    get:
      description: 获取 DAU、WAU、MAU 及趋势数据
      parameters:
      - description: 开始日期 (YYYY-MM-DD)
        in: query
        name: start_date
        required: true
        type: string
      - description: 结束日期 (YYYY-MM-DD)
        in: query
        name: end_date
        required: true
        type: string
      - description: 时间粒度
        enum:
        - day
        - week
        - month
        in: query
        name: granularity
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gamelink_internal_service_analytics.ActiveUsersData'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gamelink_internal_model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取活跃用户数据
      tags:
      - Admin/Analytics
  /admin/analytics/conversion:
    get:
      description: 获取用户转化漏斗各阶段数据
      parameters:
      - description: 开始日期 (YYYY-MM-DD)
        in: query
        name: start_date
        required: true
        type: string
      - description: 结束日期 (YYYY-MM-DD)
        in: query
        name: end_date
        required: true
        type: string
      - description: 时间粒度
        enum:
        - day
        - week
        - month
        in: query
        name: granularity
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gamelink_internal_service_analytics.ConversionFunnel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gamelink_internal_model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取转化漏斗数据
      tags:
      - Admin/Analytics
  /admin/analytics/payment:
    get:
      description: 获取付费率、ARPU、ARPPU 及收入趋势
      parameters:
      - description: 开始日期 (YYYY-MM-DD)
        in: query
        name: start_date
        required: true
        type: string
      - description: 结束日期 (YYYY-MM-DD)
        in: query
        name: end_date
        required: true
        type: string
      - description: 时间粒度
        enum:
        - day
        - week
        - month
        in: query
        name: granularity
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gamelink_internal_service_analytics.PaymentData'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gamelink_internal_model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取付费分析数据
      tags:
      - Admin/Analytics
  /admin/analytics/retention:
    get:
      description: 获取 D1、D7、D30 留存率及留存矩阵
      parameters:
      - description: 开始日期 (YYYY-MM-DD)
        in: query
        name: start_date
        required: true
        type: string
      - description: 结束日期 (YYYY-MM-DD)
        in: query
        name: end_date
        required: true
        type: string
      - description: 时间粒度
        enum:
        - day
        - week
        - month
        in: query
        name: granularity
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gamelink_internal_service_analytics.RetentionData'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gamelink_internal_model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取用户留存数据
      tags:
      - Admin/Analytics
  /admin/collection-entities:
    get:
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 状态过滤
        enum:
        - active
        - inactive
        in: query
        name: status
        type: string
      - description: 关键词搜索
        in: query
        name: keyword
        type: string
      - description: 排序字段
        enum:
        - name
        - created_at
        - total_collection_cents
        in: query
        name: sortBy
        type: string
      - description: 排序方向
        enum:
        - asc
        - desc
        in: query
        name: sortOrder
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gamelink_internal_model.ListCollectionEntitiesResponse'
      security:
      - BearerAuth: []
      summary: 列出收款主体
      tags:
      - Admin/CollectionEntities
    post:
      consumes:
      - application/json
      parameters:
      - description: 收款主体信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gamelink_internal_model.CreateCollectionEntityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/gamelink_internal_model.CollectionEntity'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gamelink_internal_model.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/gamelink_internal_model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建收款主体
      tags:
      - Admin/CollectionEntities
  /admin/collection-entities/{id}:
    get:
      parameters:
      - description: 收款主体ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gamelink_internal_model.CollectionEntity'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gamelink_internal_model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取收款主体详情
      tags:
      - Admin/CollectionEntities
    put:
      consumes:
