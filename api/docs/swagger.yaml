  gamelink_internal_model.Game:
    description: 游戏配置模型，表示平台支持的游戏及其元数据
    properties:
      category:
        description: |-
          游戏分类名称，如 moba/fps（冗余字段，向后兼容）
          @Example MOBA
          @Deprecated 使用 CategoryID 关联 GameCategory 代替
        type: string
      categoryId:
        description: |-
          游戏分类ID（外键关联 GameCategory）
          @Example 1
        type: integer
      coverUrl:
        description: |-
          游戏封面图URL
          @Example https://example.com/game-cover.png
        type: string
      createdAt:
        type: string
      description:
        description: |-
          游戏描述
          @Example 英雄联盟是一款由Riot Games开发的MOBA类游戏
        type: string
      extJson:
        description: 扩展字段（JSON格式，用于后续扩展）
        type: string
      gameCategory:
        allOf:
        - $ref: '#/definitions/gamelink_internal_model.GameCategory'
        description: |-
          Relations
          关联的游戏分类（非持久化字段）
      iconUrl:
        description: |-
          游戏图标URL
          @Example https://example.com/game-icon.png
        type: string
      id:
        type: integer
      isActive:
        description: |-
          是否上架
          @Example true
        type: boolean
      key:
        description: |-
          游戏唯一标识key，如 lol, dota2
          @Example lol
        type: string
      name:
        description: |-
          游戏名称
          @Example 英雄联盟
        type: string
      sortOrder:
        description: |-
          排序（越小越靠前）
          @Example 0
        type: integer
      updatedAt:
        type: string
    type: object
  gamelink_internal_model.GameCategory:
    description: 游戏分类模型，用于对游戏进行分类管理，如MOBA、FPS、RPG等
    properties:
      createdAt:
        type: string
      description:
        description: |-
          分类描述
          @Example 多人在线战术竞技游戏，如英雄联盟、DOTA2等
        maxLength: 1000
        type: string
      extJson:
        description: 扩展字段（JSON格式，用于后续扩展）
        type: string
      games:
        description: |-
          Relations
          该分类下的游戏列表（非持久化字段）
        items:
          $ref: '#/definitions/gamelink_internal_model.Game'
        type: array
      iconUrl:
        description: |-
          分类图标URL
          @Example https://example.com/categories/moba.png
        maxLength: 255
        type: string
      id:
        type: integer
      isActive:
        description: |-
          是否启用
          @Example true
        type: boolean
      name:
        description: |-
          分类名称（唯一）
          @Example MOBA
        maxLength: 50
        minLength: 1
        type: string
      serviceItems:
        description: 该分类下的服务项目列表（非持久化字段）
        items:
          $ref: '#/definitions/gamelink_internal_model.ServiceItem'
        type: array
      sortOrder:
        description: |-
          排序权重，数值越小越靠前
          @Example 1
        type: integer
      updatedAt:
        type: string
    required:
    - name
    type: object
