# GameLink 开发环境 Docker Compose 配置
# 使用方式: docker-compose up -d

services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GOPROXY: https://goproxy.cn,direct
    container_name: gamelink-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - SERVICE_PORT=8080
    volumes:
      # 挂载配置文件
      - ./backend/configs:/app/configs:ro
      # 挂载数据目录
      - backend-data:/app/var
    networks:
      - gamelink-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 管理后台前端
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
    container_name: gamelink-admin
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gamelink-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  gamelink-network:
    driver: bridge
    name: gamelink-network

volumes:
  backend-data:
    name: gamelink-backend-data
