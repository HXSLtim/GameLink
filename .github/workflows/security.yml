name: Security Scan

on:
  push:
    branches: [main, dev]
    paths:
      - 'api/**'
      - 'admin/**'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'admin/**'
  schedule:
    # 每周一凌晨运行
    - cron: '0 0 * * 1'
  workflow_dispatch:

env:
  GO_VERSION: '1.25.5'

jobs:
  # Go 安全扫描
  go-security:
    name: Go Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Run Gosec
        uses: securego/gosec@master
        with:
          args: -exclude-dir=vendor -exclude-dir=docs -fmt=sarif -out=gosec.sarif ./api/...
        continue-on-error: true

      - name: Upload Gosec results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec
        if: always()
        continue-on-error: true

      - name: Run govulncheck
        working-directory: api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -format text ./... 2>&1 | tee vuln-report.txt
          
          # 检查是否有漏洞
          if grep -q "Vulnerability" vuln-report.txt; then
            echo "::warning::Vulnerabilities found, please review vuln-report.txt"
          else
            echo "✅ No vulnerabilities found"
          fi

      - name: Check for outdated dependencies
        working-directory: api
        run: |
          go list -u -m all 2>/dev/null | grep '\[' || echo "All dependencies are up to date"
        continue-on-error: true

  # Node.js 依赖审计
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Run npm audit
        working-directory: admin
        run: |
          npm audit --audit-level=high --json > audit-report.json || true
          
          # 解析并显示结果
          HIGH=$(cat audit-report.json | jq '.metadata.vulnerabilities.high // 0')
          CRITICAL=$(cat audit-report.json | jq '.metadata.vulnerabilities.critical // 0')
          
          echo "High: $HIGH, Critical: $CRITICAL"
          
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Critical vulnerabilities found: $CRITICAL"
            exit 1
          fi
          
          if [ "$HIGH" -gt 0 ]; then
            echo "::warning::High vulnerabilities found: $HIGH"
          fi

      - name: Check for outdated packages
        working-directory: admin
        run: npm outdated || true
        continue-on-error: true

  # Docker 镜像扫描
  docker-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t gamelink-backend:scan ./api

      - name: Build admin image
        run: docker build -t gamelink-admin:scan ./admin

      - name: Run Trivy (backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gamelink-backend:scan'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy (admin)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gamelink-admin:scan'
          format: 'sarif'
          output: 'trivy-admin.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results (backend)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'trivy-backend'
        if: always()
        continue-on-error: true

      - name: Upload Trivy results (admin)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-admin.sarif'
          category: 'trivy-admin'
        if: always()
        continue-on-error: true

  # 密钥泄露检测
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # 安全状态汇总
  security-status:
    name: Security Status
    runs-on: ubuntu-latest
    needs: [go-security, npm-audit, docker-scan, secret-scan]
    if: always()
    
    steps:
      - name: Check Security Status
        run: |
          echo "Go Security: ${{ needs.go-security.result }}"
          echo "NPM Audit: ${{ needs.npm-audit.result }}"
          echo "Docker Scan: ${{ needs.docker-scan.result }}"
          echo "Secret Scan: ${{ needs.secret-scan.result }}"
          
          if [[ "${{ needs.go-security.result }}" == "failure" ]] || \
             [[ "${{ needs.npm-audit.result }}" == "failure" ]]; then
            echo "::warning::Security issues detected, please review"
          else
            echo "✅ Security scan completed"
          fi
