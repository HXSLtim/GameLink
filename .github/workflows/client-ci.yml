name: Client CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  client-checks:
    name: Client Quality Checks
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: TypeScript type check
        working-directory: ./client
        run: npx tsc --noEmit

      - name: ESLint check
        working-directory: ./client
        run: npm run lint
        continue-on-error: false

      - name: Run unit tests
        working-directory: ./client
        run: npm run test:coverage || npm run test:run || npm test -- --run

      - name: Security audit
        working-directory: ./client
        run: npm run security:audit
        continue-on-error: true

      - name: Build production bundle
        working-directory: ./client
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_CRYPTO_ENABLED: false

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./client/coverage/lcov.info
          flags: client
          name: client-coverage-${{ matrix.node-version }}
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-dist-${{ matrix.node-version }}
          path: client/dist
          retention-days: 7

  # Additional job for integration tests (if they exist)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: client-checks
    if: github.event_name == 'push'

    services:
      # Mock backend service for testing
      api:
        image: gamelink/api:test
        ports:
          - 8080:8080
        env:
          PORT: 8080
          DB_HOST: localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Run integration tests
        working-directory: ./client
        run: npm run test:integration
        env:
          VITE_API_BASE_URL: http://localhost:8080/api/v1
        continue-on-error: true

  # Security scan job
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'client/'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # CI status summary
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [client-checks, integration-tests, security-scan]
    if: always()

    steps:
      - name: Check CI Status
        run: |
          echo "Client Checks: ${{ needs.client-checks.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"

          if [[ "${{ needs.client-checks.result }}" == "failure" ]]; then
            echo "::error::Client checks failed"
            exit 1
          fi

          echo "✅ Client CI passed successfully"
