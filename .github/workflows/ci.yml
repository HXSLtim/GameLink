name: CI

on:
  push:
    branches: [main, develop, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.kiro/**'
  pull_request:
    branches: [main, develop, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.kiro/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.25.7'

jobs:
  # 变更检测
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'api/**'
              - 'docker-compose*.yml'
            admin:
              - 'admin/**'
            app:
              - 'app/**'

  # 后端测试
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gamelink
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: gamelink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Download dependencies
        working-directory: api
        run: go mod download

      - name: Verify dependencies
        working-directory: api
        run: go mod verify

      # CRITICAL: Code quality gate - linter failures block the build
      - name: Run linter
        working-directory: api
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run --timeout=5m --out-format=github-actions

      # CRITICAL: Code quality gate - test failures block the build
      - name: Run tests
        working-directory: api
        env:
          # DB_DSN for non-integration tests
          DB_DSN: postgresql://gamelink:testpassword@localhost:5432/gamelink_test?sslmode=disable
          # TEST_DB_* for integration tests
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "5432"
          TEST_DB_USER: gamelink
          TEST_DB_PASSWORD: testpassword
          TEST_DB_NAME: gamelink_test
          REDIS_ADDR: localhost:6379
          CACHE_TYPE: redis
          JWT_SECRET_KEY: test-secret-key-for-ci-testing-32chars
        run: |
          go test -v -race -p 1 -parallel 1 -timeout=30m -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1

      # CRITICAL: Quality gate - coverage below 70% fails the build
      - name: Check coverage threshold
        working-directory: api
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "::error::Coverage $COVERAGE% is below 70% threshold"
            exit 1
          fi
          echo "✅ Coverage meets 70% threshold"

      # NON-CRITICAL: Coverage upload failures don't block the build
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: api/coverage.out
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

  # 后端构建
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Build
        working-directory: api
        run: |
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w -X main.version=${{ github.sha }}" -o bin/gamelink cmd/main.go
          ls -la bin/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: api/bin/gamelink
          retention-days: 7

  # 管理后台测试
  admin-test:
    name: Admin Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.admin == 'true' || github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      # CRITICAL: Type check failures block the build
      - name: Type check
        working-directory: admin
        run: npm run type-check || npx tsc --noEmit

      # CRITICAL: Code quality gate - linter failures block the build
      - name: Run linter
        working-directory: admin
        run: npm run lint

      # CRITICAL: Code quality gate - test failures block the build
      - name: Run tests
        working-directory: admin
        run: npm run test:run || npm test -- --run

  # 管理后台构建
  admin-build:
    name: Admin Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.admin == 'true' || github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Build
        working-directory: admin
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_CRYPTO_ENABLED: 'false'
        run: npm run build

      - name: Check bundle size
        working-directory: admin
        run: |
          echo "Bundle size:"
          du -sh dist/
          du -sh dist/assets/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist
          retention-days: 7

  # App 端测试
  # NOTE: App CI is handled here in the main workflow to avoid duplicate execution.
  # Do NOT create a separate app-ci.yml - it would run simultaneously with this workflow
  # on app/** changes, wasting CI resources and creating race conditions.
  app-test:
    name: App Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --legacy-peer-deps

      # CRITICAL: Type check failures block the build
      - name: Type check
        working-directory: app
        run: npm run type-check

      # NOTE: app 当前无统一 lint/test 命令，先以 type-check 作为 CI 质量门禁

  # App 端构建
  app-build:
    name: App Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: app
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_CRYPTO_ENABLED: 'false'
        run: npm run build:h5

      - name: Check bundle size
        working-directory: app
        run: |
          echo "Bundle size:"
          du -sh dist/ || true
          du -sh dist/build/h5/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: app/dist
          retention-days: 7

  # Docker 镜像构建
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, backend-build, admin-test, admin-build, app-test, app-build]
    if: |
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      !contains(needs.*.result, 'failure')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: false
          tags: gamelink-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}

      - name: Build admin image
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          push: false
          tags: gamelink-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # CI 状态汇总
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend-test, backend-build, admin-test, admin-build, app-test, app-build]
    if: always()
    steps:
      - name: Check CI Status
        run: |
          echo "=== CI Job Results ==="
          echo "Backend Test: ${{ needs.backend-test.result }}"
          echo "Backend Build: ${{ needs.backend-build.result }}"
          echo "Admin Test: ${{ needs.admin-test.result }}"
          echo "Admin Build: ${{ needs.admin-build.result }}"
          echo "App Test: ${{ needs.app-test.result }}"
          echo "App Build: ${{ needs.app-build.result }}"
          echo ""

          # Helper function: Check if result is acceptable (success or skipped)
          # Jobs may be skipped when no relevant changes are detected in PRs
          check_result() {
            local job_name="$1"
            local result="$2"
            if [[ "$result" == "failure" ]]; then
              echo "::error::$job_name failed"
              return 1
            elif [[ "$result" == "cancelled" ]]; then
              echo "::warning::$job_name was cancelled"
              return 1
            elif [[ "$result" == "skipped" ]]; then
              echo "ℹ️ $job_name was skipped (no relevant changes detected)"
              return 0
            elif [[ "$result" == "success" ]]; then
              echo "✅ $job_name passed"
              return 0
            else
              echo "::warning::$job_name has unexpected status: $result"
              return 0
            fi
          }

          FAILED=0

          # Check test results (CRITICAL: tests must pass if they ran)
          echo ""
          echo "=== Checking Test Results ==="
          check_result "Backend Test" "${{ needs.backend-test.result }}" || FAILED=1
          check_result "Admin Test" "${{ needs.admin-test.result }}" || FAILED=1
          check_result "App Test" "${{ needs.app-test.result }}" || FAILED=1

          # Check build results
          echo ""
          echo "=== Checking Build Results ==="
          check_result "Backend Build" "${{ needs.backend-build.result }}" || FAILED=1
          check_result "Admin Build" "${{ needs.admin-build.result }}" || FAILED=1
          check_result "App Build" "${{ needs.app-build.result }}" || FAILED=1

          echo ""
          if [[ "$FAILED" == "1" ]]; then
            echo "::error::CI failed - one or more jobs failed or were cancelled"
            exit 1
          fi

          echo "✅ CI passed successfully (all executed jobs passed, skipped jobs are acceptable)"
