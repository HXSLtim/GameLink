name: Performance Tests

on:
  pull_request:
    branches: [main, dev]
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  GO_VERSION: '1.25.5'

jobs:
  backend-performance:
    name: Backend Performance Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gamelink
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: gamelink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Download dependencies
        working-directory: api
        run: go mod download

      - name: Run benchmark tests
        working-directory: api
        env:
          DB_DSN: postgresql://gamelink:testpassword@localhost:5432/gamelink_test?sslmode=disable
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "5432"
          TEST_DB_USER: gamelink
          TEST_DB_PASSWORD: testpassword
          TEST_DB_NAME: gamelink_test
          REDIS_ADDR: localhost:6379
          CACHE_TYPE: redis
          JWT_SECRET_KEY: test-secret-key-for-performance-testing-32chars
        run: |
          go test -bench=. -benchmem -run=^$ ./... > benchmark_result.txt 2>&1 || true

          echo "=== Benchmark Results ==="
          cat benchmark_result.txt

      - name: Download baseline benchmark
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: benchmark-baseline
          path: api/

      - name: Compare with baseline
        working-directory: api
        run: |
          if [ -f benchmark_baseline.txt ]; then
            echo "=== Comparing with baseline ==="
            go install golang.org/x/perf/cmd/benchstat@latest

            # Run benchstat comparison (allow 10% degradation)
            benchstat -delta-test=10% benchmark_baseline.txt benchmark_result.txt || true

            echo ""
            echo "✅ Benchmark comparison completed"
            echo "⚠️  Check results above for performance regressions > 10%"
          else
            echo "ℹ️  No baseline found - creating baseline from this run"
            cp benchmark_result.txt benchmark_baseline.txt
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: api/benchmark_result.txt
          retention-days: 30

      - name: Update baseline (on main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: api/benchmark_result.txt
          retention-days: 90

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const benchmark = fs.readFileSync('api/benchmark_result.txt', 'utf8');

            const body = `## 🚀 Performance Test Results

            Benchmark tests completed successfully.

            <details>
            <summary>View full benchmark results</summary>

            \`\`\`
            ${benchmark}
            \`\`\`
            </details>

            ---
            *This comment was automatically generated by the performance test workflow.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.name,
              body: body
            });

  api-response-time:
    name: API Response Time Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Build backend
        working-directory: api
        run: |
          go build -o bin/gamelink cmd/main.go

      - name: Start services
        run: |
          docker-compose -f docker-compose.yml up -d postgres redis

          # Wait for services to be ready
          sleep 10

      - name: Start backend
        working-directory: api
        run: |
          ./bin/gamelink &
          sleep 5

      - name: Install hey (HTTP load generator)
        run: |
          go install github.com/rakyll/hey@latest

      - name: Run load test
        run: |
          # Test health endpoint
          hey -n 1000 -c 10 -m GET http://localhost:8080/health > health_load.txt

          # Test API response times
          echo "=== Health Endpoint Load Test ==="
          cat health_load.txt

          # Extract average response time
          AVG_TIME=$(grep "Average" health_load.txt | awk '{print $2}')
          echo "Average response time: ${AVV_TIME}ms"

          # Fail if average > 100ms
          if (( $(echo "$AVG_TIME > 100" | bc -l) )); then
            echo "::error::Average response time ${AVG_TIME}ms exceeds 100ms threshold"
            exit 1
          fi

          echo "✅ API response time within acceptable range"

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.yml down
          pkill -f gamelink || true
