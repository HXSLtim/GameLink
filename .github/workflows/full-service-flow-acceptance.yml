name: Full Service Flow Acceptance

on:
  workflow_dispatch:
    inputs:
      run_oss_smoke:
        description: "Run optional OSS smoke check after full acceptance"
        required: false
        default: false
        type: boolean
      oss_expected_host:
        description: "Optional expected OSS host (e.g. xxx.cos.ap-shanghai.myqcloud.com)"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.7"

jobs:
  full-service-flow-acceptance:
    name: Full Service Flow Acceptance (Smoke + Order + Dispute + Withdraw + Integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gamelink
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: gamelink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamelink -d gamelink_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: Download backend dependencies
        working-directory: api
        run: go mod download

      - name: Start backend with seed data
        working-directory: api
        env:
          APP_ENV: development
          DB_DSN: postgresql://gamelink:testpassword@localhost:5432/gamelink_test?sslmode=disable
          CACHE_TYPE: redis
          REDIS_ADDR: localhost:6379
          JWT_SECRET_KEY: test-secret-key-for-full-service-flow-acceptance-32chars
          SEED_ENABLED: "true"
          CRYPTO_ENABLED: "false"
          OSS_PROVIDER: ${{ secrets.OSS_PROVIDER || 'qcloud' }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY: ${{ secrets.OSS_ACCESS_KEY }}
          OSS_SECRET_KEY: ${{ secrets.OSS_SECRET_KEY }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_ENABLED: ${{ secrets.OSS_ENABLED || 'false' }}
        run: |
          nohup go run cmd/main.go > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait backend health
        working-directory: api
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/api/v1/healthz >/dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready in time"
          tail -n 200 backend.log || true
          exit 1

      - name: Run full service flow acceptance
        id: full_acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ./api/scripts/run_full_service_flow_acceptance.ps1 `
            -BaseUrl "http://127.0.0.1:8080/api/v1" `
            -DBUser "gamelink" `
            -DBName "gamelink_test" 2>&1 |
            Tee-Object -FilePath "api/full-service-flow-acceptance.log"
          if ($LASTEXITCODE -ne 0) {
            throw "full service flow acceptance failed with exit code $LASTEXITCODE"
          }

      - name: Run OSS smoke check (optional)
        if: ${{ github.event.inputs.run_oss_smoke == 'true' }}
        id: oss_smoke
        shell: pwsh
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ENABLED: ${{ secrets.OSS_ENABLED || 'false' }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:OSS_ENABLED -ne "true") {
            throw "run_oss_smoke=true but OSS_ENABLED secret is not true"
          }
          if ([string]::IsNullOrWhiteSpace($env:OSS_ENDPOINT)) {
            throw "run_oss_smoke=true but OSS_ENDPOINT secret is empty"
          }
          & ./api/scripts/run_oss_smoke.ps1 `
            -BaseUrl "http://127.0.0.1:8080/api/v1" `
            -ExpectedHost "${{ github.event.inputs.oss_expected_host }}" 2>&1 |
            Tee-Object -FilePath "api/oss-smoke.log"
          if ($LASTEXITCODE -ne 0) {
            throw "oss smoke check failed with exit code $LASTEXITCODE"
          }

      - name: Generate acceptance summary
        if: always()
        shell: pwsh
        run: |
          $outcome = "${{ steps.full_acceptance.outcome }}"
          $ossRequested = "${{ github.event.inputs.run_oss_smoke }}"
          $ossOutcome = ""
          if ($ossRequested -eq "true") {
            $ossOutcome = "${{ steps.oss_smoke.outcome }}"
          }
          $summaryPath = "api/full-service-flow-acceptance-summary.md"
          $lines = @()
          $lines += "# Full Service Flow Acceptance Summary"
          $lines += ""
          $lines += "- Outcome: **$outcome**"
          $lines += "- OSS Smoke Requested: **$ossRequested**"
          if ($ossRequested -eq "true") {
            $lines += "- OSS Smoke Outcome: **$ossOutcome**"
          }
          $lines += "- Generated At (UTC): $(Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mm:ssZ')"
          $lines += ""
          $lines += "## Acceptance Tail Log"
          $lines += ""
          if (Test-Path "api/full-service-flow-acceptance.log") {
            $tail = Get-Content "api/full-service-flow-acceptance.log" -Tail 120
            $lines += "```text"
            $lines += $tail
            $lines += "```"
          } else {
            $lines += "_No acceptance log found._"
          }
          if ($ossRequested -eq "true") {
            $lines += ""
            $lines += "## OSS Smoke Tail Log"
            $lines += ""
            if (Test-Path "api/oss-smoke.log") {
              $ossTail = Get-Content "api/oss-smoke.log" -Tail 80
              $lines += "```text"
              $lines += $ossTail
              $lines += "```"
            } else {
              $lines += "_No OSS smoke log found._"
            }
          }
          $content = ($lines -join "`n")
          Set-Content -Path $summaryPath -Value $content -Encoding UTF8
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $content

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-service-flow-backend-log
          path: api/backend.log
          retention-days: 7

      - name: Upload acceptance outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-service-flow-acceptance-output
          path: |
            api/full-service-flow-acceptance.log
            api/oss-smoke.log
            api/full-service-flow-acceptance-summary.md
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup backend process
        if: always()
        working-directory: api
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi
