name: Test Report

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.25.5'

jobs:
  aggregate-reports:
    name: Aggregate Test Reports
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backend-coverage
          path: coverage/

      - name: Download admin coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: admin-coverage
          path: coverage/

      - name: Download client coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: client-coverage
          path: coverage/

      - name: Generate coverage report
        run: |
          echo "# Test Coverage Report" > coverage-report.md
          echo "" >> coverage-report.md
          echo "**Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> coverage-report.md
          echo "" >> coverage-report.md

          # Backend coverage
          echo "## Backend (Go)" >> coverage-report.md
          if [ -f coverage/coverage.out ]; then
            COVERAGE=$(go tool cover -func=coverage/coverage.out 2>/dev/null | tail -1 | awk '{print $3}' || echo "N/A")
            echo "**Overall Coverage:** $COVERAGE" >> coverage-report.md
            echo "" >> coverage-report.md
            echo '```' >> coverage-report.md
            go tool cover -func=coverage/coverage.out 2>/dev/null | tail -20 >> coverage-report.md || true
            echo '```' >> coverage-report.md
          else
            echo "No coverage data available" >> coverage-report.md
          fi
          echo "" >> coverage-report.md

          # Admin coverage
          echo "## Admin Panel (TypeScript)" >> coverage-report.md
          if [ -f coverage/admin/coverage-summary.json ]; then
            echo '```json' >> coverage-report.md
            cat coverage/admin/coverage-summary.json >> coverage-report.md
            echo '```' >> coverage-report.md
          else
            echo "No coverage data available" >> coverage-report.md
          fi
          echo "" >> coverage-report.md

          # Client coverage
          echo "## Client (TypeScript)" >> coverage-report.md
          if [ -f coverage/client/coverage-summary.json ]; then
            echo '```json' >> coverage-report.md
            cat coverage/client/coverage-summary.json >> coverage-report.md
            echo '```' >> coverage-report.md
          else
            echo "No coverage data available" >> coverage-report.md
          fi
          echo "" >> coverage-report.md

          # Summary
          echo "## Summary" >> coverage-report.md
          echo "" >> coverage-report.md
          echo "| Component | Coverage | Status |" >> coverage-report.md
          echo "|-----------|----------|--------|" >> coverage-report.md

          # Backend status
          if [ -f coverage/coverage.out ]; then
            BACKEND_COV=$(go tool cover -func=coverage/coverage.out 2>/dev/null | tail -1 | awk '{print $3}' | sed 's/%//')
            if (( $(echo "$BACKEND_COV >= 70" | bc -l) )); then
              echo "| Backend | ${BACKEND_COV}% | ✅ Pass |" >> coverage-report.md
            else
              echo "| Backend | ${BACKEND_COV}% | ❌ Fail |" >> coverage-report.md
            fi
          else
            echo "| Backend | N/A | ⚠️ No Data |" >> coverage-report.md
          fi

          # Overall status
          cat coverage-report.md

      - name: Comment PR with report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('coverage-report.md', 'utf8');

            const body = `## 📊 Test Coverage Report

            ${report}

            ---
            *This comment was automatically generated by the test report workflow.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.name,
              body: body
            });

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report.md
          retention-days: 30

  performance-report:
    name: Performance Test Report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: benchmark-results
          path: benchmarks/

      - name: Generate performance report
        run: |
          echo "# Performance Test Report" > performance-report.md
          echo "" >> performance-report.md
          echo "**Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> performance-report.md
          echo "" >> performance-report.md

          if [ -f benchmarks/benchmark_result.txt ]; then
            echo "## Benchmark Results" >> performance-report.md
            echo "" >> performance-report.md
            echo '```' >> performance-report.md
            cat benchmarks/benchmark_result.txt >> performance-report.md
            echo '```' >> performance-report.md
          else
            echo "No benchmark data available for this PR" >> performance-report.md
          fi

          cat performance-report.md

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance-report.md
          retention-days: 30

  security-report:
    name: Security Scan Report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download security scan results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: security-*
          path: security/
          merge-multiple: true

      - name: Generate security report
        run: |
          echo "# Security Scan Report" > security-report.md
          echo "" >> security-report.md
          echo "**Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> security-report.md
          echo "" >> security-report.md

          echo "## Scan Summary" >> security-report.md
          echo "" >> security-report.md
          echo "| Component | Status | Findings |" >> security-report.md
          echo "|-----------|--------|----------|" >> security-report.md

          # govulncheck
          if [ -f security/govulncheck.txt ]; then
            VULNS=$(grep -c "Vulnerability" security/govulncheck.txt || echo "0")
            if [ "$VULNS" == "0" ]; then
              echo "| Backend | ✅ Pass | No vulnerabilities found |" >> security-report.md
            else
              echo "| Backend | ⚠️ Warning | ${VULNS} vulnerabilities found |" >> security-report.md
            fi
          else
            echo "| Backend | ℹ️ Skipped | No scan data |" >> security-report.md
          fi

          # npm audit (admin)
          if [ -f security/npm-admin.txt ]; then
            VULNS=$(grep -c "vulnerabilities" security/npm-admin.txt || echo "0")
            if [ "$VULNS" == "0" ] || grep -q "found 0 vulnerabilities" security/npm-admin.txt; then
              echo "| Admin | ✅ Pass | No vulnerabilities found |" >> security-report.md
            else
              echo "| Admin | ⚠️ Warning | Vulnerabilities found |" >> security-report.md
            fi
          else
            echo "| Admin | ℹ️ Skipped | No scan data |" >> security-report.md
          fi

          # npm audit (client)
          if [ -f security/npm-client.txt ]; then
            VULNS=$(grep -c "vulnerabilities" security/npm-client.txt || echo "0")
            if [ "$VULNS" == "0" ] || grep -q "found 0 vulnerabilities" security/npm-client.txt; then
              echo "| Client | ✅ Pass | No vulnerabilities found |" >> security-report.md
            else
              echo "| Client | ⚠️ Warning | Vulnerabilities found |" >> security-report.md
            fi
          else
            echo "| Client | ℹ️ Skipped | No scan data |" >> security-report.md
          fi

          # trivy
          if [ -f security/trivy.txt ]; then
            if grep -q "Total: 0 (UNKNOWN: 0, LOW: 0, MEDIUM: 0, HIGH: 0, CRITICAL: 0)" security/trivy.txt; then
              echo "| Docker Images | ✅ Pass | No vulnerabilities found |" >> security-report.md
            else
              echo "| Docker Images | ⚠️ Warning | Vulnerabilities found |" >> security-report.md
            fi
          else
            echo "| Docker Images | ℹ️ Skipped | No scan data |" >> security-report.md
          fi

          # gitleaks
          if [ -f security/gitleaks.txt ]; then
            if grep -q "No leaks found" security/gitleaks.txt; then
              echo "| Secret Leaks | ✅ Pass | No secrets found |" >> security-report.md
            else
              echo "| Secret Leaks | ❌ Fail | Potential secrets detected |" >> security-report.md
            fi
          else
            echo "| Secret Leaks | ℹ️ Skipped | No scan data |" >> security-report.md
          fi

          cat security-report.md

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md
          retention-days: 30

  final-summary:
    name: Final Test Summary
    runs-on: ubuntu-latest
    needs: [aggregate-reports, performance-report, security-report]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports/

      - name: Generate final summary
        run: |
          echo "# 🧪 Complete Test Summary" > final-summary.md
          echo "" >> final-summary.md
          echo "**PR:** #${{ github.event.number }}" >> final-summary.md
          echo "**Branch:** ${{ github.head_ref }}" >> final-summary.md
          echo "**Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> final-summary.md
          echo "" >> final-summary.md

          # Merge all reports
          if [ -f reports/coverage-report/coverage-report.md ]; then
            cat reports/coverage-report/coverage-report.md >> final-summary.md
          fi

          if [ -f reports/performance-report/performance-report.md ]; then
            echo "" >> final-summary.md
            cat reports/performance-report/performance-report.md >> final-summary.md
          fi

          if [ -f reports/security-report/security-report.md ]; then
            echo "" >> final-summary.md
            cat reports/security-report/security-report.md >> final-summary.md
          fi

          cat final-summary.md

      - name: Comment PR with final summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('final-summary.md', 'utf8');

            const body = `${summary}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.name,
              body: body
            });

      - name: Upload final summary
        uses: actions/upload-artifact@v4
        with:
          name: final-test-summary
          path: final-summary.md
          retention-days: 90
